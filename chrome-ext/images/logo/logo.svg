<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Erasure logo: comment bubbles flying into a trash can -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c7380"/>
      <stop offset="1" stop-color="#34474f"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d95a1"/>
      <stop offset="1" stop-color="#546e7a"/>
    </linearGradient>
  </defs>

  <!-- motion trails -->
  <g stroke="#90a4ae" stroke-width="3" stroke-linecap="round">
    <line x1="3" y1="44" x2="12" y2="47"/>
    <line x1="7" y1="54" x2="14" y2="56"/>
    <line x1="47" y1="4" x2="53" y2="9"/>
  </g>

  <!-- bubble dropping into the bin (drawn first: the rim covers its bottom) -->
  <g transform="translate(6 -3) rotate(32 56 50)">
    <rect x="41" y="38" width="30" height="21" rx="7" fill="#4688f1" stroke="#1a3e8a" stroke-width="2.2"/>
    <rect x="47" y="44.5" width="18" height="2.8" rx="1.4" fill="#fff"/>
    <rect x="47" y="50" width="12" height="2.8" rx="1.4" fill="#fff"/>
  </g>

  <!-- bin -->
  <path d="M33 62 H95 L89 116 Q88.4 122 82 122 H46 Q39.6 122 39 116 Z" fill="url(#body)" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#7f97a3" stroke-width="3.5" stroke-linecap="round">
    <line x1="52" y1="73" x2="53.5" y2="112"/>
    <line x1="64" y1="73" x2="64" y2="112"/>
    <line x1="76" y1="73" x2="74.5" y2="112"/>
  </g>
  <rect x="29" y="56" width="70" height="9" rx="4" fill="url(#lid)" stroke="#263238" stroke-width="2.5"/>

  <!-- lid, lifted off to the upper right -->
  <g transform="rotate(24 92 40)">
    <rect x="62" y="38" width="62" height="8" rx="4" fill="url(#lid)" stroke="#263238" stroke-width="2.5"/>
    <rect x="84" y="32" width="18" height="7" rx="3.5" fill="none" stroke="#263238" stroke-width="2.5"/>
  </g>

  <!-- big bubble flying in -->
  <g transform="rotate(-14 32 24)">
    <rect x="13" y="9" width="40" height="28" rx="9" fill="#ff3b30" stroke="#8e1b14" stroke-width="2.4"/>
    <path d="M23 36 L20 46 L32 36.5" fill="#ff3b30" stroke="#8e1b14" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="24" cy="23" r="3.2" fill="#fff"/>
    <circle cx="33" cy="23" r="3.2" fill="#fff"/>
    <circle cx="42" cy="23" r="3.2" fill="#fff"/>
  </g>

  <!-- small bubble -->
  <g transform="rotate(12 70 12)">
    <rect x="59" y="3" width="23" height="16" rx="6" fill="#ffc107" stroke="#8a6500" stroke-width="2"/>
    <path d="M65 18 L64 24 L71 18.5" fill="#ffc107" stroke="#8a6500" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
