<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Erasure logo, simplified for 16/32 px -->
  <!-- bin -->
  <path d="M7 15.5 H25 L23.2 29 Q23 30.5 21.4 30.5 H10.6 Q9 30.5 8.8 29 Z" fill="#455a64" stroke="#1c262b" stroke-width="1.2" stroke-linejoin="round"/>
  <g stroke="#90a4ae" stroke-width="1.4" stroke-linecap="round">
    <line x1="12.5" y1="19" x2="13" y2="27.5"/>
    <line x1="16" y1="19" x2="16" y2="27.5"/>
    <line x1="19.5" y1="19" x2="19" y2="27.5"/>
  </g>
  <rect x="5.5" y="13.5" width="21" height="3.2" rx="1.6" fill="#78909c" stroke="#1c262b" stroke-width="1.2"/>
  <!-- lid, lifted off to the upper right -->
  <g transform="rotate(28 24 9)">
    <rect x="17" y="8" width="15" height="3" rx="1.5" fill="#78909c" stroke="#1c262b" stroke-width="1.2"/>
  </g>
  <!-- bubble flying in -->
  <g transform="rotate(-12 9 7)">
    <rect x="1.5" y="1" width="15" height="10.5" rx="3.5" fill="#ff3b30" stroke="#8e1b14" stroke-width="1.2"/>
    <path d="M5 11.1 L4 15 L9 11.3" fill="#ff3b30" stroke="#8e1b14" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="5.5" cy="6.3" r="1.3" fill="#fff"/>
    <circle cx="9" cy="6.3" r="1.3" fill="#fff"/>
    <circle cx="12.5" cy="6.3" r="1.3" fill="#fff"/>
  </g>
</svg>
