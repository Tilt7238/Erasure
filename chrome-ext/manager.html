<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Erasure Manager</title>
    <link rel="icon" href="images/logo_32.png">
    <style>
    :root {
        --bg: #212121;
        --panel: #2c2c2c;
        --panel-2: #333;
        --line: #444;
        --text: #f1f1f1;
        --muted: #aaa;
        --accent: #4688f1;
        --danger: #c62828;
        --ok: #66bb6a;
        --warn: #ffb74d;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: sans-serif;
        font-size: 14px;
    }
    header {
        position: sticky;
        top: 0;
        z-index: 1;
        background-color: var(--bg);
        padding: 12px 16px 8px;
        border-bottom: 1px solid var(--line);
    }
    h1 {
        margin: 0 0 10px;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    h1 img { width: 24px; height: 24px; }
    .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
    }
    button {
        background-color: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 13px;
        cursor: pointer;
    }
    button:hover:not(:disabled) { filter: brightness(1.2); }
    button:disabled { opacity: .45; cursor: default; }
    button.secondary { background-color: #555; }
    button.danger { background-color: var(--danger); }
    .tabs { display: flex; gap: 0; }
    .tabs button {
        border-radius: 0;
        background-color: var(--panel-2);
        border: 1px solid var(--line);
    }
    .tabs button:first-child { border-radius: 6px 0 0 6px; }
    .tabs button:last-child { border-radius: 0 6px 6px 0; }
    .tabs button.active { background-color: var(--accent); border-color: var(--accent); }
    input[type="date"], input[type="search"] {
        background-color: var(--panel);
        color: var(--text);
        color-scheme: dark;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 13px;
    }
    input[type="search"] { flex: 1 1 200px; min-width: 160px; }
    label { display: inline-flex; align-items: center; gap: 6px; }
    .group {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 8px;
        background-color: var(--panel);
        border-radius: 6px;
    }
    .spacer { flex: 1; }
    #statusLine {
        flex: 1 1 260px;
        padding: 7px 10px;
        background-color: var(--panel-2);
        border-radius: 6px;
        overflow-wrap: anywhere;
    }
    #statusLine.error { color: #ff8a80; }
    #summary { color: var(--muted); font-size: 13px; }
    .hint { color: var(--muted); font-size: 12px; margin: 0; }
    main { padding: 8px 16px 24px; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
        text-align: left;
        vertical-align: top;
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
    }
    th { color: var(--muted); font-weight: normal; font-size: 12px; }
    td.check, th.check { width: 28px; }
    td.date { white-space: nowrap; width: 120px; color: var(--muted); }
    td.text { overflow-wrap: anywhere; }
    td.video { width: 28%; overflow-wrap: anywhere; }
    td.video a { color: #8ab4f8; }
    td.state { width: 90px; font-size: 12px; white-space: nowrap; }
    tr.selected { background-color: rgba(70, 136, 241, .15); }
    tr.deleted td { opacity: .45; text-decoration: line-through; }
    tr.deleted td.state { color: var(--ok); text-decoration: none; opacity: 1; }
    tr.skipped td.state { color: var(--warn); }
    tr.queued td.state { color: var(--accent); }
    tr[hidden] { display: none; }
    .empty { color: var(--muted); padding: 40px 0; text-align: center; }
    </style>
</head>

<body>
    <header>
        <h1><img src="images/logo_32.png" alt="">Erasure Manager</h1>
        <div class="row">
            <div class="tabs" id="typeTabs">
                <button data-type="comments" class="active">Comments</button>
                <button data-type="livechats">Live chats</button>
                <button data-type="posts">Community posts</button>
            </div>
            <button id="loadButton">Load list</button>
            <button id="stopButton" class="danger" disabled>Stop</button>
            <button id="showTabButton" class="secondary" disabled>Show My Activity tab</button>
            <span id="statusLine">Choose a type and click “Load list”.</span>
        </div>
        <div class="row">
            <input type="search" id="filterText" placeholder="Filter by text or video…">
            <button id="selectAll" class="secondary">Select all</button>
            <button id="selectNone" class="secondary">Select none</button>
            <span class="group">
                Select up to (incl.)
                <input type="date" id="cutoffDate">
                <button id="selectUpTo" class="secondary">Select</button>
            </span>
            <span class="spacer"></span>
            <label><input type="checkbox" id="oldestFirst" checked> Oldest first</label>
            <button id="deleteSelected" class="danger" disabled>Delete selected</button>
        </div>
        <div class="row">
            <span id="summary"></span>
            <span class="spacer"></span>
            <p class="hint">Loading and deleting run in a My Activity tab in your browser window — keep that tab in front (it pauses while hidden). Shift-click selects a range.</p>
        </div>
    </header>
    <main>
        <table>
            <thead>
                <tr>
                    <th class="check"><input type="checkbox" id="toggleVisible" title="Select / deselect all shown"></th>
                    <th>Date</th>
                    <th>Text</th>
                    <th>Video / post</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="emptyNote">No items loaded.</div>
    </main>
    <script src="manager.js"></script>
</body>

</html>
